[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergence-multiscale"
version = "0.1.0"
description = "Self-contained dynamical independence calculations and SSDI optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
plots = ["pandas>=2", "matplotlib>=3.7"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
